name: Upstream Sync (Branch, Tags)

permissions:
    contents: write

on:
    schedule:
        - cron: "00 22 * * *" 
    workflow_dispatch:

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest
        if: ${{ github.event.repository.fork }}

        steps:
            - name: Checkout target repo
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0
                  token: ${{ secrets.PAT_TOKEN }}

            # 1. 同步分支（原有 action）
            - name: Sync Upstream (branch)
              uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
              with:
                  target_repo_token: ${{ secrets.PAT_TOKEN }}
                  upstream_sync_repo: ggml-org/llama.cpp
                  upstream_sync_branch: master
                  target_sync_branch: master
                  test_mode: false

            # 2. 同步 tags
            - name: Fetch upstream tags
              run: |
                  # 如果 upstream 远程仓库不存在则添加，存在则更新 URL
                  git remote add upstream https://github.com/ggml-org/llama.cpp.git 2>/dev/null || git remote set-url upstream https://github.com/ggml-org/llama.cpp.git
                  git fetch upstream --tags

            - name: Push tags to origin
              run: git push origin --tags

            - name: Check for Failure
              if: failure()
              run: |
                  echo "[Error] Sync failed. Please check manually."
                  exit 1
